<!DOCTYPE html>
<html>
<head>
    <title>Basics</title>

    <style>
        body {
            background-color: pink;
            color: white;
            margin: 0;
        }

        h1 {
            text-align: center;
        }

        .shops {
            display: flex;
            justify-content: center;
            gap: 30px;
            text-align: center;
        }

        .shop {
            width: 300px;
        }

        .shop img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        a {
            color: white;
            font-size: 20px;
        }

        hr {
            border: 0;
            border-top: 2px solid white;
            width: 100%;
        }

        .copyright {
            text-align: right;
            font-family: monospace;
            font-style: italic;
            margin: 10px;
        }
    </style>
</head>

<body>

    <h1>✿ Online Shops ✿</h1>

    <div class="shops">

        <div class="shop">
            <img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8" alt="Shop 1">
            <br>
            <a href="https://www.amazon.com/">Amazon</a>
        </div>

        <div class="shop">
            <img src="https://images.unsplash.com/photo-1556742049-0cfed4f6a45d" alt="Shop 2">
            <br>
            <a href="https://www.ebay.com/">eBay</a>
        </div>

    </div>

    <hr>

    <div class="copyright">
        © Sirikanya 2026
    </div>

</body>
</html>
