<!DOCTYPE html>
<html>
<head>
    <title>Tab</title>

    <style>
        table {
            border-collapse: collapse;
            width: 600px;
        }

        td {
            border: 1px solid black;
            padding: 20px;
            width: 50%;
        }

        .first {
            background-color: darkkhaki;
        }

        .second {
            background-color: lightsalmon;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <td class="first">First cell</td>
            <td class="second">Second cell</td>
        </tr>
    </table>

</body>
</html>
