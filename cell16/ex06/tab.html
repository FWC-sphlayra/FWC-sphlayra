<!DOCTYPE html>
<html>
<head>
    <title>Tab</title>

    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            width: 50%;
            height: 200px;
            text-align: center;
            border: 2px solid black;
            font-size: 30px;
        }

        .box1 {
            background-color: lightblue;
        }

        .box2 {
            background-color: lightpink;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <td class="box1">LOVE</td>
            <td class="box2">YOU</td>
        </tr>
    </table>

</body>
</html>
