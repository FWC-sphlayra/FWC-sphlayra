<!DOCTYPE html>
<html>
<head>
    <title>Responsive Table</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        table {
            width: 100%;
            height: 100%;
            table-layout: fixed;
            border-collapse: collapse;
        }

        td {
            border: 1px solid black;
            text-align: center;
            font-size: clamp(12px, 5vw, 60px);
        }

        .box1 {
            background-color: lightblue;
        }

        .box2 {
            background-color: lightpink;
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <td class="box1">LOVE</td>
            <td class="box2">YOU</td>
        </tr>
    </table>
</body>
</html>
